<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background App Icon Square with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="#29303c" stroke-width="4"/>

  <!-- Outer Camera Dial -->
  <circle cx="256" cy="256" r="180" fill="#15181e" stroke="#2a3240" stroke-width="12"/>
  
  <!-- Knurling / Dial ridges -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#e5a93c" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Golden Brass Lens Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldRing)" stroke-width="14"/>

  <!-- Deep Cine Lens Glass with Emerald/Amber reflections -->
  <circle cx="256" cy="256" r="135" fill="url(#lensGrad)"/>

  <!-- Aperture Blades -->
  <g stroke="#e5a93c" stroke-width="2.5" opacity="0.6">
    <line x1="200" y1="160" x2="310" y2="190"/>
    <line x1="310" y1="190" x2="340" y2="290"/>
    <line x1="340" y1="290" x2="260" y2="350"/>
    <line x1="260" y1="350" x2="170" y2="310"/>
    <line x1="170" y1="310" x2="160" y2="210"/>
    <line x1="160" y1="210" x2="200" y2="160"/>
  </g>

  <!-- Inner Pupil -->
  <circle cx="256" cy="256" r="48" fill="#05070a"/>

  <!-- Optical Glint / Reflection -->
  <ellipse cx="215" cy="215" rx="36" ry="18" transform="rotate(-35 215 215)" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="295" cy="295" rx="18" ry="8" transform="rotate(-35 295 295)" fill="#e5a93c" opacity="0.3"/>

  <!-- Red Recording / 35mm Dot -->
  <circle cx="370" cy="142" r="14" fill="#ef4444"/>
</svg>
